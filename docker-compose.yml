version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pio-helpdesk-postgres
    environment:
      POSTGRES_DB: pio_helpdesk
      POSTGRES_USER: pio_user
      POSTGRES_PASSWORD: pio_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pio-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pio-helpdesk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pio-network

  # Backend API (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pio-helpdesk-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pio_user:pio_password@postgres:5432/pio_helpdesk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - pio-network
    command: npm run dev

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pio-helpdesk-frontend
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - pio-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  pio-network:
    driver: bridge 